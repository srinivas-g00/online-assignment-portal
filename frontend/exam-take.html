<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Take MCQ Exam - Online Assignment Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
</head>
<body class="exam-body">
  <div class="main" style="margin-top: 24px; max-width: 820px;">
    <!-- Sticky Exam Timer Header -->
    <div class="timer-bar" id="timerBar">
      <div>
        <span class="badge" style="background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;">Live Exam</span>
        <h3 id="examTitle" style="margin:4px 0 0;font-size:1.1rem;color:#0f172a;">Loading exam details...</h3>
      </div>
      <div class="timer-display">
        <span class="timer-label">Time Remaining</span>
        <div class="clock" id="clock">--:--</div>
      </div>
    </div>

    <!-- Questions Container -->
    <div id="questionsRoot" style="margin-top: 20px;">
      <div class="empty" style="text-align: center; padding: 40px 20px;">
        <p>Loading questions, please wait...</p>
      </div>
    </div>

    <!-- Final Submission Action -->
    <div class="exam-footer" style="margin-top: 24px; margin-bottom: 40px; text-align: right;">
      <button class="btn block" id="submitExamBtn" style="padding: 14px 20px; font-size: 1rem; font-weight: 600;">
        Submit Exam
      </button>
    </div>
  </div>

  <!-- Overlay Notification & Dialog Roots -->
  <div id="noticeRoot"></div>
  <div id="modalRoot"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/exam-take.js"></script>
</body>
</html>
