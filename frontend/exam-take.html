
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">

  <title>Take MCQ Exam | Online Assignment Portal</title>

  <link rel="stylesheet" href="css/style.css">

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E"
  >

  <style>
    body.exam-body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(99, 102, 241, 0.10), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(6, 182, 212, 0.08), transparent 28%),
        #f5f7fc;
    }

    .exam-page {
      width: min(100% - 32px, 850px);
      margin: 32px auto 60px;
    }

    .timer-bar {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 24px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(14px);
    }

    .exam-heading {
      min-width: 0;
    }

    .exam-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 30px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .exam-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    #examTitle {
      margin: 9px 0 0;
      color: #0f172a;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      font-weight: 750;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .timer-display {
      flex-shrink: 0;
      min-width: 145px;
      padding: 12px 16px;
      border: 1px solid #e0e7ff;
      border-radius: 14px;
      background: #f5f6ff;
      text-align: center;
    }

    .timer-label {
      display: block;
      margin-bottom: 4px;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .clock {
      color: #3730a3;
      font-size: 1.65rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    #questionsRoot {
      display: grid;
      gap: 18px;
      margin-top: 24px;
    }

    #questionsRoot > .empty {
      padding: 55px 20px !important;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      background: #fff;
      color: #64748b;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.04);
    }

    .exam-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 25px !important;
      padding: 20px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.04);
    }

    #submitExamBtn {
      width: auto;
      min-width: 190px;
      padding: 14px 24px !important;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: #fff;
      font-size: 15px !important;
      font-weight: 750 !important;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    #submitExamBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.3);
    }

    #submitExamBtn:focus-visible {
      outline: 3px solid rgba(99, 102, 241, 0.35);
      outline-offset: 3px;
    }

    #submitExamBtn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 600px) {
      .exam-page {
        width: min(100% - 20px, 850px);
        margin-top: 14px;
      }

      .timer-bar {
        top: 8px;
        padding: 14px;
        gap: 10px;
        border-radius: 14px;
      }

      .timer-display {
        min-width: 105px;
        padding: 9px 10px;
      }

      .clock {
        font-size: 1.35rem;
      }

      .timer-label {
        font-size: 9px;
      }

      .exam-footer {
        padding: 14px;
      }

      #submitExamBtn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="exam-body">

  <main class="exam-page">

    <!-- Sticky Exam Timer Header -->
    <header class="timer-bar" id="timerBar">

      <div class="exam-heading">
        <span class="exam-status">Live Exam</span>
        <h3 id="examTitle">Loading exam details...</h3>
      </div>

      <div class="timer-display">
        <span class="timer-label">Time Remaining</span>
        <div class="clock" id="clock" aria-live="off">--:--</div>
      </div>

    </header>

    <!-- Questions Container -->
    <section id="questionsRoot" aria-label="Exam questions">
      <div class="empty">
        <p>Loading questions, please wait...</p>
      </div>
    </section>

    <!-- Final Submission Action -->
    <footer class="exam-footer">
      <button
        class="btn block"
        id="submitExamBtn"
        type="button"
      >
        Submit Exam
      </button>
    </footer>

  </main>

  <!-- Overlay Notification & Dialog Roots -->
  <div id="noticeRoot"></div>
  <div id="modalRoot"></div>

  <!-- Existing Exam Scripts -->
  <script src="js/api.js"></script>
  <script src="js/exam-take.js"></script>

</body>
</html>
