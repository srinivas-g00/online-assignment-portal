
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">

  <title>Student Dashboard | Online Assignment Portal</title>

  <link rel="stylesheet" href="css/style.css">

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E"
  >

  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 5% 0%, rgba(99, 102, 241, .09), transparent 30%),
        radial-gradient(circle at 95% 5%, rgba(6, 182, 212, .07), transparent 28%),
        #f5f7fc;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid #e8edf5;
      box-shadow: 0 4px 20px rgba(15, 23, 42, .04);
      backdrop-filter: blur(16px);
    }

    .top .brand {
      max-width: 1240px;
      margin: auto;
      padding: 14px 24px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: white;
      font-size: 17px;
      font-weight: 850;
      box-shadow: 0 6px 15px rgba(79, 70, 229, .24);
    }

    .brand-left h1 {
      margin: 0;
      color: #111827;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.3px;
    }

    .brand-left small {
      display: block;
      margin-top: 3px;
      color: #64748b;
      font-size: 12px;
    }

    .top-actions .btn {
      border-radius: 10px;
      font-weight: 700;
    }

    .main {
      width: min(100% - 40px, 1200px);
      margin: 30px auto 60px;
    }

    .bar {
      position: relative;
      overflow: hidden;
      padding: 25px 28px;
      border: 1px solid #e0e7ff;
      border-radius: 20px;
      background: linear-gradient(120deg, #eef2ff, #f8faff 65%, #ecfeff);
      box-shadow: 0 10px 30px rgba(15, 23, 42, .045);
    }

    .bar::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -65px;
      top: -95px;
      border: 28px solid rgba(99, 102, 241, .055);
      border-radius: 50%;
      pointer-events: none;
    }

    .who {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      border: 3px solid rgba(255, 255, 255, .9);
      border-radius: 17px;
      background: linear-gradient(135deg, #4f46e5, #0891b2);
      color: white;
      font-size: 23px;
      font-weight: 800;
      box-shadow: 0 7px 18px rgba(79, 70, 229, .2);
    }

    #studentName {
      display: block;
      color: #172554;
      font-size: 19px;
      font-weight: 800;
    }

    #studentUsername {
      display: block;
      margin-top: 5px;
      color: #64748b;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 7px;
      margin: 24px 0;
      padding: 7px;
      overflow-x: auto;
      border: 1px solid #e5eaf2;
      border-radius: 14px;
      background: white;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .035);
      scrollbar-width: thin;
    }

    .tabs button {
      flex: 1 0 auto;
      min-height: 42px;
      padding: 10px 20px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .tabs button:hover {
      background: #f1f5f9;
      color: #3730a3;
    }

    .tabs button.active {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: white;
      box-shadow: 0 5px 12px rgba(79, 70, 229, .2);
    }

    .panel {
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid #e5eaf2;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 8px 25px rgba(15, 23, 42, .045);
    }

    .panel > h3 {
      margin: 0;
      padding: 20px 23px;
      border-bottom: 1px solid #edf0f5;
      background: #fff;
      color: #172554;
      font-size: 16px;
      font-weight: 800;
    }

    .panel-body {
      padding: 23px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field input {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid #dce3ee;
      border-radius: 10px;
      background: #fbfcff;
      color: #172033;
      font: inherit;
      font-size: 13px;
      transition: .2s ease;
    }

    .field input:focus {
      outline: none;
      border-color: #818cf8;
      background: white;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, .11);
    }

    .field input::placeholder {
      color: #94a3b8;
    }

    .card-grid {
      min-width: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th {
      padding: 14px 15px;
      background: #f8faff;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      text-align: left;
      white-space: nowrap;
    }

    table td {
      padding: 15px;
      border-bottom: 1px solid #edf0f5;
      color: #334155;
      font-size: 13px;
    }

    table tbody tr:hover {
      background: #fafbff;
    }

    .hidden {
      display: none !important;
    }

    #facultyDetailWrap {
      margin-top: 22px !important;
    }

    #facultyDetailWrap .panel-body {
      min-width: 0;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(99, 102, 241, .25);
      outline-offset: 2px;
    }

    @media (max-width: 700px) {
      .top .brand {
        padding: 12px 16px;
      }

      .brand-left h1 {
        font-size: 14px;
      }

      .logo {
        width: 40px;
        height: 40px;
      }

      .main {
        width: calc(100% - 24px);
        margin-top: 18px;
      }

      .bar {
        padding: 19px;
        border-radius: 15px;
      }

      .tabs {
        margin: 17px 0;
      }

      .tabs button {
        padding: 10px 15px;
      }

      .panel {
        border-radius: 14px;
      }

      .panel > h3 {
        padding: 17px;
      }

      .panel-body {
        padding: 17px;
      }

      .panel-body:has(table) {
        overflow-x: auto;
      }

      table {
        min-width: 560px;
      }
    }

    @media (max-width: 420px) {
      .top .brand {
        padding: 11px;
      }

      .brand-left {
        gap: 9px;
      }

      .brand-left h1 {
        font-size: 12px;
      }

      .brand-left small {
        font-size: 10px;
      }

      .top-actions .btn {
        padding: 8px 10px;
        font-size: 11px;
      }

      .avatar {
        width: 49px;
        height: 49px;
      }

      #studentName {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Header Bar -->
  <header class="top">
    <div class="brand">

      <div class="brand-left">
        <div class="logo">OA</div>

        <div>
          <h1>Online Assignment Portal</h1>
          <small>Student Dashboard</small>
        </div>
      </div>

      <div class="top-actions">
        <button class="btn secondary" onclick="logout()" type="button">
          Log out
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="main">

    <!-- Student Profile Banner -->
    <section class="bar">
      <div class="who">

        <div class="avatar" id="avatarInitial">S</div>

        <div>
          <b id="studentName">Loading...</b>
          <small id="studentUsername">—</small>
        </div>

      </div>
    </section>

    <!-- Navigation Tabs -->
    <nav class="tabs" aria-label="Student Navigation Tabs">

      <button class="active" data-tab="faculties" type="button">
        Faculties
      </button>

      <button data-tab="courses" type="button">
        My Courses
      </button>

      <button data-tab="marks" type="button">
        My Marks
      </button>

      <button data-tab="exams" type="button">
        Exams
      </button>

    </nav>

    <!-- Tab 1: Faculty Directory & Search -->
    <section id="tab-faculties">
      <div class="panel">

        <h3>Explore Faculties</h3>

        <div class="panel-body">

          <div class="field" style="margin-bottom: 16px;">
            <input
              id="facSearch"
              type="text"
              placeholder="Search by name, subject, or branch..."
              autocomplete="off"
              aria-label="Search faculties"
            >
          </div>

          <div class="card-grid" id="facultyList"></div>

        </div>
      </div>
    </section>

    <!-- Tab 2: Registered Courses -->
    <section id="tab-courses" class="hidden">
      <div class="panel">

        <h3>My Registered Courses</h3>

        <div class="panel-body">
          <div class="card-grid" id="coursesList"></div>
        </div>

      </div>
    </section>

    <!-- Tab 3: Assignment Marks -->
    <section id="tab-marks" class="hidden">
      <div class="panel">

        <h3>My Assignment Marks</h3>

        <div class="panel-body">

          <table>
            <thead>
              <tr>
                <th>Assignment</th>
                <th>Faculty</th>
                <th>Submitted</th>
                <th>Marks</th>
              </tr>
            </thead>

            <tbody id="marksBody"></tbody>
          </table>

        </div>
      </div>
    </section>

    <!-- Tab 4: MCQ Exams -->
    <section id="tab-exams" class="hidden">
      <div class="panel">

        <h3>Available & Past Exams</h3>

        <div class="panel-body">
          <div class="card-grid" id="examsList"></div>
        </div>

      </div>
    </section>

    <!-- Dynamic Faculty Detail & Submissions -->
    <section
      id="facultyDetailWrap"
      class="hidden"
      style="margin-top: 18px;"
    >
      <div class="panel">
        <div class="panel-body" id="facultyDetail"></div>
      </div>
    </section>

  </main>

  <!-- Overlay Notification & Dialog Roots -->
  <div id="noticeRoot"></div>
  <div id="modalRoot"></div>

  <!-- Existing Client Scripts -->
  <script src="js/api.js"></script>
  <script src="js/student.js?v=999"></script>

</body>
</html>
